/* V6.9 motion: original-game-like clear sparkle + falling refill */
.cell.pop .fruit{animation:v69clear .30s ease-out forwards!important}
@keyframes v69clear{0%{transform:scale(1);opacity:1;filter:brightness(1)}35%{transform:scale(1.16);opacity:1;filter:brightness(1.8) drop-shadow(0 0 7px #fff)}70%{transform:scale(.72);opacity:.75;filter:brightness(2.2) drop-shadow(0 0 12px #fff)}100%{transform:scale(.12);opacity:0;filter:brightness(2.6)}}
.cell.dropin .fruit{animation:v69drop .24s cubic-bezier(.18,.72,.28,1.12) both!important}
@keyframes v69drop{0%{transform:translateY(-72px) scale(.92);opacity:.35}75%{transform:translateY(4px) scale(1.02);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}

@keyframes v69hit{50%{transform:scale(1.08);filter:brightness(1.35)}}

@keyframes v69spark{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(var(--sx),var(--sy)) scale(.05);opacity:0}}
</style><style id="v610-special-fx">
.fxbeam,.fxburst,.fxheartwash{position:absolute;z-index:29;pointer-events:none}
.fxbeam{background:linear-gradient(90deg,transparent,#fff 18%,#8eeeff 45%,#fff 72%,transparent);box-shadow:0 0 10px #fff,0 0 20px #75cfff;animation:fxbeam .34s ease-out forwards}
.fxbeam.h{left:0;width:100%;height:13px}.fxbeam.v{top:0;height:100%;width:13px;background:linear-gradient(180deg,transparent,#fff 18%,#8eeeff 45%,#fff 72%,transparent)}
@keyframes fxbeam{0%{opacity:0;filter:blur(7px);transform:scale(.25)}35%{opacity:1;filter:blur(1px);transform:scale(1.05)}100%{opacity:0;filter:blur(5px);transform:scale(1.18)}}
.fxburst{width:0;height:0;border-radius:50%;box-shadow:0 0 12px 9px #fff,0 0 28px 18px #a26cff,0 0 42px 27px #65dfff;animation:fxburst .42s ease-out forwards}
@keyframes fxburst{0%{transform:scale(.15);opacity:1}100%{transform:scale(3.2);opacity:0}}
.fxheartwash{inset:0;background:radial-gradient(circle,#fff9 0 5%,#ff7fcb77 22%,#7ccfff44 48%,transparent 72%);animation:fxheart .48s ease-out forwards}
@keyframes fxheart{0%{opacity:0;transform:scale(.35)}40%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
</style><style id="v611-special-combo-fx">
.fxtriple{position:absolute;z-index:31;pointer-events:none;background:linear-gradient(90deg,transparent,#fff 18%,#83e9ff 46%,#fff 72%,transparent);box-shadow:0 0 10px #fff,0 0 22px #67cfff;animation:fxtriple .46s ease-out forwards}
.fxtriple.h{left:0;width:100%;height:14px}.fxtriple.v{top:0;height:100%;width:14px;background:linear-gradient(180deg,transparent,#fff 18%,#83e9ff 46%,#fff 72%,transparent)}
@keyframes fxtriple{0%{opacity:0;filter:blur(8px);transform:scale(.2)}30%{opacity:1;filter:blur(1px);transform:scale(1.03)}100%{opacity:0;filter:blur(5px);transform:scale(1.2)}}
.fxheartparticle{position:absolute;z-index:32;pointer-events:none;font-size:26px;line-height:1;background:conic-gradient(#ff6677,#ffe06a,#67eb88,#56e4ee,#718dff,#bd72ff,#ff70b7,#ff6677);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:1px #fff;filter:drop-shadow(0 0 4px #fff);animation:fxheartparticle .58s ease-out forwards}
@keyframes fxheartparticle{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.55)}}
</style></head><body><div id="app"><div class="top"><div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">剩余时间</div><div class="value time" id="time">60</div></div><div class="stat"><div class="label">最高分</div><div class="value" id="best">0</div></div></div><div id="wrap"><div id="board"></div><div id="count"></div><div id="overlay"><div class="big">消消乐练习 V6.11</div><div class="sub">组合特效动画版</div><button id="play" type="button">开始游戏</button></div></div><div class="controls"><button id="restart">重新开始</button><button id="test">特效测试</button><button id="hint">提示</button></div></div>
<script>
(function(){var music=new Audio("assets/music-loop.m4a?v=1");music.loop=true;music.preload="auto";music.volume=.72;
function startMusic(){try{var p=music.play();if(p&&p.catch)p.catch(function(){});}catch(err){}}


var R=10,C=8,T=["🍓","🍑","🍌","🫐","🥑"],board=document.getElementById("board"),scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),overlay=document.getElementById("overlay"),countEl=document.getElementById("count");
var grid=[],spec=[],score=0,left=60,timer=null,playing=false,down=null;
function rnd(){return T[Math.floor(Math.random()*T.length)]}
function init(){grid=[];spec=[];for(var r=0;r<R;r++){grid[r]=[];spec[r]=[];for(var c=0;c<C;c++){var x=rnd();while((c>1&&grid[r][c-1]===x&&grid[r][c-2]===x)||(r>1&&grid[r-1][c]===x&&grid[r-2][c]===x))x=rnd();grid[r][c]=x;spec[r][c]=""}}}
function draw(){board.innerHTML="";for(var r=0;r<R;r++)for(var c=0;c<C;c++){var e=document.createElement("div");e.className="cell"+(spec[r][c]?" special "+spec[r][c]:"");e.setAttribute("data-r",r);e.setAttribute("data-c",c);e.style.transform="translate("+(c*100)+"%,"+(r*100)+"%)";var f=document.createElement("div");f.className="fruit";f.setAttribute("data-f",grid[r][c]);f.textContent="";e.appendChild(f);board.appendChild(e)}}
function scan(){var hit=[];for(var i=0;i<R*C;i++)hit[i]=false;for(var r=0;r<R;r++){var s=0;for(var c=1;c<=C;c++){if(c===C||grid[r][c]!==grid[r][s]){if(c-s>=3)for(var x=s;x<c;x++)hit[r*C+x]=true;s=c}}}for(var c2=0;c2<C;c2++){var s2=0;for(var r2=1;r2<=R;r2++){if(r2===R||grid[r2][c2]!==grid[s2][c2]){if(r2-s2>=3)for(var y=s2;y<r2;y++)hit[y*C+c2]=true;s2=r2}}}return hit}
function any(hit){for(var i=0;i<hit.length;i++)if(hit[i])return true;return false}
function swap(r1,c1,r2,c2){var t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t;var s=spec[r1][c1];spec[r1][c1]=spec[r2][c2];spec[r2][c2]=s}
function specialHit(r,c,hit){var s=spec[r][c],x,y;if(s=="bomb"){for(y=r-1;y<=r+1;y++)for(x=c-1;x<=c+1;x++)if(y>=0&&y<R&&x>=0&&x<C)hit[y*C+x]=true}else if(s=="starH"){for(x=0;x<C;x++)hit[r*C+x]=true}else if(s=="starV"){for(y=0;y<R;y++)hit[y*C+c]=true}}
function expand(hit){var changed=true,r,c,i;while(changed){changed=false;for(r=0;r<R;r++)for(c=0;c<C;c++){i=r*C+c;if(hit[i]&&spec[r][c]){var before=0,after=0,j;for(j=0;j<hit.length;j++)if(hit[j])before++;specialHit(r,c,hit);for(j=0;j<hit.length;j++)if(hit[j])after++;if(after>before)changed=true}}}}
function fall(hit){expand(hit);var n=0;for(var c=0;c<C;c++){var vals=[];for(var r=R-1;r>=0;r--)if(!hit[r*C+c])vals.push({v:grid[r][c],s:spec[r][c]});for(var rr=R-1,k=0;rr>=0;rr--,k++)if(k<vals.length){grid[rr][c]=vals[k].v;spec[rr][c]=vals[k].s}else{grid[rr][c]=rnd();spec[rr][c]=""}}for(var i=0;i<hit.length;i++)if(hit[i])n++;score+=n*2;scoreEl.textContent=score}
function makeSpecial(hit,pr,pc){
var hs=[],vs=[],r,c,s,e,len,i,best=null;
for(r=0;r<R;r++){s=0;for(c=1;c<=C;c++){if(c==C||grid[r][c]!=grid[r][s]){len=c-s;if(len>=3)hs.push({r:r,s:s,e:c-1,n:len});s=c}}}
for(c=0;c<C;c++){s=0;for(r=1;r<=R;r++){if(r==R||grid[r][c]!=grid[s][c]){len=r-s;if(len>=3)vs.push({c:c,s:s,e:r-1,n:len});s=r}}}
for(i=0;i<hs.length;i++){for(var j=0;j<vs.length;j++){if(vs[j].c>=hs[i].s&&vs[j].c<=hs[i].e&&hs[i].r>=vs[j].s&&hs[i].r<=vs[j].e){best={r:hs[i].r,c:vs[j].c,s:"bomb"};break}}if(best)break}
if(!best){for(i=0;i<hs.length;i++)if(hs[i].n>=5){c=(pr==hs[i].r&&pc>=hs[i].s&&pc<=hs[i].e)?pc:Math.floor((hs[i].s+hs[i].e)/2);best={r:hs[i].r,c:c,s:"heart"};break}}
if(!best){for(i=0;i<vs.length;i++)if(vs[i].n>=5){r=(pc==vs[i].c&&pr>=vs[i].s&&pr<=vs[i].e)?pr:Math.floor((vs[i].s+vs[i].e)/2);best={r:r,c:vs[i].c,s:"heart"};break}}
if(!best){for(i=0;i<hs.length;i++)if(hs[i].n==4){c=(pr==hs[i].r&&pc>=hs[i].s&&pc<=hs[i].e)?pc:Math.floor((hs[i].s+hs[i].e)/2);best={r:hs[i].r,c:c,s:"starH"};break}}
if(!best){for(i=0;i<vs.length;i++)if(vs[i].n==4){r=(pc==vs[i].c&&pr>=vs[i].s&&pr<=vs[i].e)?pr:Math.floor((vs[i].s+vs[i].e)/2);best={r:r,c:vs[i].c,s:"starV"};break}}
if(best){hit[best.r*C+best.c]=false;spec[best.r][best.c]=best.s}
return best}
function sparkle(hit){var cells=board.querySelectorAll(".cell");for(var i=0;i<hit.length;i++)if(hit[i]&&cells[i]){var r=cells[i].getBoundingClientRect(),b=board.getBoundingClientRect();for(var k=0;k<3;k++){var s=document.createElement("i");s.className="spark";s.style.left=(r.left-b.left+r.width/2)+"px";s.style.top=(r.top-b.top+r.height/2)+"px";s.style.setProperty("--sx",((k-1)*18)+"px");s.style.setProperty("--sy",((k%2?1:-1)*16)+"px");board.appendChild(s)}}}
function markDrop(){var cells=board.querySelectorAll(".cell");for(var i=0;i<cells.length;i++)cells[i].className+=" dropin"}
function resolve(done,pr,pc){var hit=scan();if(!any(hit)){draw();if(done)done();return}makeSpecial(hit,pr,pc);var cells=board.querySelectorAll(".cell");sparkle(hit);for(var i=0;i<hit.length;i++)if(hit[i]&&cells[i])cells[i].className+=" pop";setTimeout(function(){fall(hit);draw();markDrop();setTimeout(function(){resolve(done,-1,-1)},270)},300)}
function addBeam(r,c,dir){var e=document.createElement("i");e.className="fxbeam "+dir;if(dir=="h"){e.style.top=((r+.5)*10)+"%"}else{e.style.left=((c+.5)*12.5)+"%"}board.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},430)}
function addBurst(r,c){var e=document.createElement("i");e.className="fxburst";e.style.left=((c+.5)*12.5)+"%";e.style.top=((r+.5)*10)+"%";board.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},500)}
function addHeartWash(){var e=document.createElement("i");e.className="fxheartwash";board.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},560)}
function addTriple(r,c,dir){for(var d=-1;d<=1;d++){var e=document.createElement("i");e.className="fxtriple "+dir;if(dir=="h")e.style.top=((Math.max(0,Math.min(R-1,r+d))+.5)*10)+"%";else e.style.left=((Math.max(0,Math.min(C-1,c+d))+.5)*12.5)+"%";board.appendChild(e);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x)},540)})(e)}}
function heartField(){for(var r=0;r<R;r++)for(var c=0;c<C;c++){var e=document.createElement("i");e.className="fxheartparticle";e.textContent="♥";e.style.left=((c+.5)*12.5)+"%";e.style.top=((r+.5)*10)+"%";e.style.animationDelay=((r+c)%5*18)+"ms";board.appendChild(e);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x)},760)})(e)}}
function specialFX(r1,c1,r2,c2){var a=spec[r1][c1],b=spec[r2][c2];if(a=="heart"&&b=="heart"){heartField();addHeartWash();return}if((a=="bomb"&&(b=="starH"||b=="starV"))||(b=="bomb"&&(a=="starH"||a=="starV"))){var br=a=="bomb"?r1:r2,bc=a=="bomb"?c1:c2,ss=a=="bomb"?b:a;addBurst(br,bc);addTriple(br,bc,ss=="starH"?"h":"v");return}if(a=="heart"||b=="heart"){addHeartWash()}if(a=="bomb")addBurst(r1,c1);if(b=="bomb")addBurst(r2,c2);if(a=="starH")addBeam(r1,c1,"h");if(b=="starH")addBeam(r2,c2,"h");if(a=="starV")addBeam(r1,c1,"v");if(b=="starV")addBeam(r2,c2,"v")}
function combo(r1,c1,r2,c2){specialFX(r1,c1,r2,c2);var s1=spec[r1][c1],s2=spec[r2][c2],hit=[],i,r,c,x,y;for(i=0;i<R*C;i++)hit[i]=false;hit[r1*C+c1]=true;hit[r2*C+c2]=true;
if(s1=="heart"&&s2=="heart"){for(i=0;i<R*C;i++)hit[i]=true}
else if(s1=="heart"||s2=="heart"){var hr=s1=="heart"?r1:r2,hc=s1=="heart"?c1:c2,or=s1=="heart"?r2:r1,oc=s1=="heart"?c2:c1,os=spec[or][oc],typ=grid[or][oc];if(os){var made=0;for(r=0;r<R&&made<8;r++)for(c=0;c<C&&made<8;c++)if(!spec[r][c]&&Math.random()<0.22){spec[r][c]=os;hit[r*C+c]=true;made++}}else{for(r=0;r<R;r++)for(c=0;c<C;c++)if(grid[r][c]==typ)hit[r*C+c]=true}}
else if((s1=="bomb"&&(s2=="starH"||s2=="starV"))||(s2=="bomb"&&(s1=="starH"||s1=="starV"))){var br=s1=="bomb"?r1:r2,bc=s1=="bomb"?c1:c2,ss=s1=="bomb"?s2:s1;if(ss=="starH"){for(y=Math.max(0,br-1);y<=Math.min(R-1,br+1);y++)for(x=0;x<C;x++)hit[y*C+x]=true}else{for(x=Math.max(0,bc-1);x<=Math.min(C-1,bc+1);x++)for(y=0;y<R;y++)hit[y*C+x]=true}}
else{specialHit(r1,c1,hit);specialHit(r2,c2,hit)}
fall(hit);draw();setTimeout(function(){resolve()},205)}
function trySwap(r1,c1,r2,c2){if(!playing)return;if(r2<0||r2>=R||c2<0||c2>=C)return;swap(r1,c1,r2,c2);draw();setTimeout(function(){if(spec[r1][c1]||spec[r2][c2]){combo(r1,c1,r2,c2);return}var hit=scan();if(any(hit)){resolve(null,r2,c2)}else{swap(r1,c1,r2,c2);draw()}},205)}
function start(){startMusic();if(timer)clearInterval(timer);playing=false;score=0;left=60;scoreEl.textContent="0";timeEl.textContent="60";overlay.style.display="none";init();draw();var n=3;countEl.textContent=n;var cd=setInterval(function(){n--;if(n>0){countEl.textContent=n}else{clearInterval(cd);countEl.textContent="";playing=true;timer=setInterval(function(){left--;timeEl.textContent=left;if(left<=0){clearInterval(timer);playing=false;overlay.innerHTML='<div class="big">时间到！</div><div class="sub">本局得分：'+score+'</div><button type="button" onclick="window.__startGame()">再来一局</button>';overlay.style.display="flex"}},1000)}},700)}
window.__startGame=start;var playBtn=document.getElementById("play");if(playBtn)playBtn.onclick=function(){startMusic();start();};
board.addEventListener("touchstart",function(e){if(!playing)return;var el=e.target;while(el&&el!==board&&!el.getAttribute("data-r"))el=el.parentNode;if(!el||el===board)return;var t=e.touches[0];down={r:+el.getAttribute("data-r"),c:+el.getAttribute("data-c"),x:t.clientX,y:t.clientY};e.preventDefault()},{passive:false});
board.addEventListener("touchend",function(e){if(!down||!playing)return;var t=e.changedTouches[0],dx=t.clientX-down.x,dy=t.clientY-down.y,r2=down.r,c2=down.c;if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1;var d=down;down=null;trySwap(d.r,d.c,r2,c2);e.preventDefault()},{passive:false});
document.getElementById("restart").onclick=start;
document.getElementById("test").onclick=function(){if(!playing)return;spec[2][2]="bomb";spec[2][5]="starH";spec[6][2]="starV";spec[6][5]="heart";draw();var d=document.getElementById("debug");d.style.display="block";d.textContent="已放入：紫色3×3、横向星星、竖向星星、彩虹爱心";};
document.getElementById("hint").onclick=function(){};
})();
</script></body></html>
