<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#21150f"><title>消消乐练习 V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#69472b,#23160f 70%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#fff;touch-action:none}
#app{height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.top{height:76px;display:flex;align-items:center;justify-content:space-around;background:linear-gradient(#8c5a31,#503019);border:4px solid #2d190e;border-radius:18px;box-shadow:inset 0 2px 0 #c8925c,0 5px 12px #0008}
.stat{text-align:center;min-width:95px}.label{font-size:13px;color:#f7ddb0}.value{font-size:28px;font-weight:900;text-shadow:0 3px 2px #0008}.time.low{animation:pulse .5s infinite;color:#ffd25c}@keyframes pulse{50%{transform:scale(1.13)}}
#wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{position:relative;width:min(94vw,460px);aspect-ratio:8/10;border:9px solid #422817;border-radius:13px;background:linear-gradient(135deg,#44291a,#2b1a12);box-shadow:inset 0 0 0 3px #9c693a,inset 0 0 25px #000,0 8px 18px #0009;overflow:hidden;touch-action:none}
.cell{position:absolute;width:12.5%;height:10%;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;transition:transform 180ms cubic-bezier(.2,.85,.3,1),opacity 150ms;z-index:2}
.cell:before{content:"";position:absolute;inset:4%;border-radius:12px;background:#0001}
.fruit{position:relative;width:82%;height:82%;display:flex;align-items:center;justify-content:center;font-size:clamp(27px,8vw,43px);filter:drop-shadow(0 4px 2px #0007);user-select:none;transform:scale(1);transition:transform 120ms,filter 120ms}
.cell.selected .fruit{transform:scale(1.15);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 4px 2px #0007)}
.cell.pop .fruit{animation:pop .24s ease-out forwards}@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.38);filter:brightness(1.8) drop-shadow(0 0 12px #fff)}100%{transform:scale(.05) rotate(18deg);opacity:0}}
.cell.born .fruit{animation:born .26s cubic-bezier(.2,1.5,.5,1)}@keyframes born{0%{transform:scale(.25)}100%{transform:scale(1)}}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff7a0;pointer-events:none;z-index:9;animation:spark .45s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
.float{position:absolute;z-index:20;left:50%;top:43%;transform:translate(-50%,-50%);font-weight:1000;font-style:italic;font-size:clamp(30px,10vw,55px);white-space:nowrap;color:#fff06b;text-shadow:0 4px 0 #b94318,0 7px 7px #000;animation:float .75s ease-out forwards;pointer-events:none}@keyframes float{0%{opacity:0;transform:translate(-50%,-30%) scale(.45)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-75%) scale(.9)}}
#count{position:absolute;z-index:30;font-size:100px;font-weight:1000;color:#ffe963;text-shadow:0 7px 0 #b84218,0 12px 15px #000;animation:count .7s ease both}@keyframes count{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.2);opacity:1}100%{transform:scale(.8);opacity:0}}
.controls{height:62px;display:flex;gap:10px;padding-top:9px}.controls button{flex:1;border:0;border-radius:15px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(#f3a73b,#bd5b18);box-shadow:inset 0 2px #ffd68b,0 4px #6d310f}.controls button:active{transform:translateY(3px);box-shadow:inset 0 2px #ffd68b,0 1px #6d310f}
#overlay{position:absolute;inset:0;z-index:40;background:#160d09d9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.big{font-size:42px;font-weight:1000;color:#ffe76a;text-shadow:0 4px #a9431b}.sub{margin:10px 0 22px;color:#ffe9c9}#overlay button{padding:13px 35px;border:0;border-radius:18px;font-size:20px;font-weight:900;background:#ffb43e;color:#54250e}
.rainbow .fruit{font-size:0}.rainbow .fruit:after{content:"★";font-size:38px;color:#fff;text-shadow:0 0 4px #fff,0 0 10px #f0f,0 0 16px #0ff;background:conic-gradient(#f44,#fd4,#5e5,#4df,#85f,#f5c,#f44);border-radius:50%;width:80%;height:80%;display:grid;place-items:center}
</style></head><body><div id="app"><div class="top"><div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">剩余时间</div><div class="value time" id="time">60</div></div><div class="stat"><div class="label">最高分</div><div class="value" id="best">0</div></div></div><div id="wrap"><div id="board"></div><div id="count"></div><div id="overlay"><div class="big">消消乐练习</div><div class="sub">滑动水果 · 60秒挑战</div><button id="play">开始游戏</button></div></div><div class="controls"><button id="restart">重新开始</button><button id="hint">提示</button></div></div>
<script>
const R=10,C=8,T=["🍓","🍑","🍌","🫐","🥑"],boardEl=document.querySelector("#board"),scoreEl=document.querySelector("#score"),timeEl=document.querySelector("#time"),bestEl=document.querySelector("#best"),overlay=document.querySelector("#overlay"),countEl=document.querySelector("#count");
let a=[],score=0,left=60,best=+(localStorage.m3best||0),playing=false,busy=false,timer=null,down=null,sel=null,id=1;bestEl.textContent=best;
const sleep=m=>new Promise(r=>setTimeout(r,m)),key=(r,c)=>r*C+c,near=(p,q)=>Math.abs(p.r-q.r)+Math.abs(p.c-q.c)==1,rnd=()=>T[Math.random()*T.length|0];
function make(type,r,c,special=""){return{id:id++,type,r,c,special}}
function initial(){a=Array.from({length:R},()=>Array(C));for(let r=0;r<R;r++)for(let c=0;c<C;c++){let x;do{x=rnd()}while((c>1&&a[r][c-1].type==x&&a[r][c-2].type==x)||(r>1&&a[r-1][c].type==x&&a[r-2][c].type==x));a[r][c]=make(x,r,c)}if(!moves().length)return initial()}
function pos(el,r,c){el.style.transform=`translate(${c*100}%,${r*100}%)`}
function render(born=[]){let old=new Map([...boardEl.children].map(e=>[+e.dataset.id,e]));for(let r=0;r<R;r++)for(let c=0;c<C;c++){let o=a[r][c];if(!o)continue;let e=old.get(o.id);if(!e){e=document.createElement("div");e.className="cell"+(o.special?" rainbow":"");e.dataset.id=o.id;e.innerHTML='<div class="fruit">'+o.type+'</div>';boardEl.append(e);if(born.includes(o.id))e.classList.add("born")}else old.delete(o.id);e.dataset.r=r;e.dataset.c=c;e.classList.toggle("selected",sel&&sel.r==r&&sel.c==c);pos(e,r,c)}old.forEach(e=>e.remove())}
function matches(){let s=new Set(),groups=[];for(let r=0;r<R;r++){let st=0;for(let c=1;c<=C;c++)if(c==C||a[r][c]?.type!=a[r][st]?.type){if(c-st>=3){let g=[];for(let x=st;x<c;x++)g.push(key(r,x)),s.add(key(r,x));groups.push(g)}st=c}}for(let c=0;c<C;c++){let st=0;for(let r=1;r<=R;r++)if(r==R||a[r][c]?.type!=a[st][c]?.type){if(r-st>=3){let g=[];for(let x=st;x<r;x++)g.push(key(x,c)),s.add(key(x,c));groups.push(g)}st=r}}return{s,groups}}
function swap(p,q){let x=a[p.r][p.c];a[p.r][p.c]=a[q.r][q.c];a[q.r][q.c]=x;[a[p.r][p.c].r,a[p.r][p.c].c]=[p.r,p.c];[a[q.r][q.c].r,a[q.r][q.c].c]=[q.r,q.c]}
function moves(){let out=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(let [dr,dc] of [[0,1],[1,0]]){let q={r:r+dr,c:c+dc};if(q.r>=R||q.c>=C)continue;swap({r,c},q);let ok=matches().s.size;swap({r,c},q);if(ok)out.push([{r,c},q])}return out}
function sparks(e){let b=boardEl.getBoundingClientRect(),x=(+e.dataset.c+.5)*b.width/C,y=(+e.dataset.r+.5)*b.height/R;for(let i=0;i<6;i++){let z=document.createElement("i");z.className="spark";z.style.left=x+"px";z.style.top=y+"px";let an=Math.random()*6.28,d=25+Math.random()*35;z.style.setProperty("--x",Math.cos(an)*d+"px");z.style.setProperty("--y",Math.sin(an)*d+"px");boardEl.append(z);setTimeout(()=>z.remove(),500)}}
function praise(chain){if(chain<2)return;let z=document.createElement("div");z.className="float";z.textContent=chain>=4?"UNBELIEVABLE!":chain>=3?"PERFECT!":"GREAT!";boardEl.append(z);setTimeout(()=>z.remove(),800)}
async function resolve(){let chain=0;while(true){let m=matches();if(!m.s.size)break;chain++;praise(chain);let create=null;for(let g of m.groups)if(g.length>=5){let k=g[Math.floor(g.length/2)],r=Math.floor(k/C),c=k%C;create={r,c,type:a[r][c].type}}let els=[];for(let k of m.s){let r=Math.floor(k/C),c=k%C,e=boardEl.querySelector(`[data-id="${a[r][c]?.id}"]`);if(e){e.classList.add("pop");sparks(e);els.push(e)}}score+=m.s.size*2;scoreEl.textContent=score;await sleep(230);for(let k of m.s){let r=Math.floor(k/C),c=k%C;a[r][c]=null}if(create)a[create.r][create.c]=make(create.type,create.r,create.c,"rainbow");for(let c=0;c<C;c++){let w=R-1;for(let r=R-1;r>=0;r--)if(a[r][c]){a[w][c]=a[r][c];a[w][c].r=w;a[w][c].c=c;if(w!=r)a[r][c]=null;w--}while(w>=0){a[w][c]=null;w--}}render();await sleep(210);let born=[];for(let c=0;c<C;c++)for(let r=0;r<R;r++)if(!a[r][c]){let o=make(rnd(),r,c);a[r][c]=o;born.push(o.id)}render(born);await sleep(270)}if(!moves().length){await sleep(200);initial();render()}}
async function trySwap(p,q){if(!playing||busy||!near(p,q))return;busy=true;sel=null;swap(p,q);render();await sleep(190);let special=a[q.r][q.c]?.special||a[p.r][p.c]?.special;if(special){let sp=a[q.r][q.c]?.special?a[q.r][q.c]:a[p.r][p.c],other=sp===a[q.r][q.c]?a[p.r][p.c]:a[q.r][q.c],type=other.type;for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(a[r][c].type==type)a[r][c].type=sp.type;sp.special="";await resolve()}else if(matches().s.size)await resolve();else{swap(p,q);render();await sleep(190)}busy=false}
boardEl.addEventListener("pointerdown",e=>{let x=e.target.closest(".cell");if(!x||busy||!playing)return;e.preventDefault();down={r:+x.dataset.r,c:+x.dataset.c,x:e.clientX,y:e.clientY};sel={r:down.r,c:down.c};render();boardEl.setPointerCapture?.(e.pointerId)});
boardEl.addEventListener("pointermove",e=>{if(!down||busy)return;let dx=e.clientX-down.x,dy=e.clientY-down.y,th=boardEl.clientWidth/C*.28;if(Math.max(Math.abs(dx),Math.abs(dy))<th)return;let q={r:down.r+(Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0),c:down.c+(Math.abs(dx)>=Math.abs(dy)?Math.sign(dx):0)},p={r:down.r,c:down.c};down=null;if(q.r>=0&&q.r<R&&q.c>=0&&q.c<C)trySwap(p,q)});
boardEl.addEventListener("pointerup",e=>{if(!down)return;let p={r:down.r,c:down.c};down=null;if(sel&&sel.r==p.r&&sel.c==p.c){sel=null;render()}});
async function start(){clearInterval(timer);playing=false;busy=true;overlay.style.display="none";score=0;left=60;scoreEl.textContent=0;timeEl.textContent=60;timeEl.classList.remove("low");initial();render();for(let n=3;n>=1;n--){countEl.textContent=n;countEl.style.animation="none";countEl.offsetHeight;countEl.style.animation="count .7s ease both";await sleep(720)}countEl.textContent="";playing=true;busy=false;timer=setInterval(()=>{if(!playing)return;left--;timeEl.textContent=left;if(left<=10)timeEl.classList.add("low");if(left<=0)end()},1000)}
function end(){playing=false;clearInterval(timer);if(score>best){best=score;localStorage.m3best=best;bestEl.textContent=best}overlay.innerHTML=`<div class="big">时间到！</div><div class="sub">本局得分：${score}<br>最高分：${best}</div><button id="again">再来一局</button>`;overlay.style.display="flex";document.querySelector("#again").onclick=start}
document.querySelector("#play").onclick=start;document.querySelector("#restart").onclick=start;document.querySelector("#hint").onclick=()=>{if(!playing||busy)return;let m=moves()[0];if(!m)return;sel=m[0];render();setTimeout(()=>{sel=null;render()},700)};
</script></body></html>
