<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>水果消消乐·练习版</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#ccefff}.app{height:100dvh;max-width:520px;margin:auto;padding:12px 8px;display:flex;flex-direction:column;gap:7px}h2{text-align:center;margin:0}.stats,.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.buttons{grid-template-columns:1fr 1fr}.card,button{border:0;border-radius:12px;padding:7px;text-align:center;background:white}.card b{display:block;font-size:23px}button{background:#ffad22;color:white;font-size:16px;font-weight:bold}.hintbtn{background:#3da1dc}.wrap{flex:1;min-height:0;background:#4b332a;padding:5px;border-radius:16px}.board{height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(10,1fr);gap:2px;touch-action:none}.cell{display:flex;align-items:center;justify-content:center;background:#2e211d;border-radius:7px;font-size:min(8.5vw,43px);user-select:none}.hint{outline:3px solid #ffe642;outline-offset:-3px}.foot{text-align:center;font-size:12px}</style></head><body><div class="app"><h2>水果消消乐 · 练习版</h2><div class="stats"><div class="card">得分<b id="s">0</b></div><div class="card">倒计时<b id="t">60s</b></div><div class="card">最佳<b id="b">0</b></div></div><div class="buttons"><button id="start">开始 / 重开</button><button id="hint" class="hintbtn">提示一步</button></div><div class="wrap"><div id="board" class="board"></div></div><div id="msg" class="foot">滑动相邻水果进行交换</div></div><script>(()=>{const R=10,C=8,F=["🍓","🍑","🍌","🫐","🥑"];let a=[],score=0,time=60,on=false,busy=false,timer,p=null,best=+(localStorage.m3best||0);const q=x=>document.getElementById(x),bd=q("board");q("b").textContent=best;const rnd=()=>Math.floor(Math.random()*F.length),id=(r,c)=>r*C+c,inside=(r,c)=>r>=0&&r<R&&c>=0&&c<C;function swap(r,c,x,y){let z=a[r][c];a[r][c]=a[x][y];a[x][y]=z}function matches(){let s=new Set;for(let r=0;r<R;r++){let st=0;for(let c=1;c<=C;c++){if(c<C&&a[r][c]!=null&&a[r][c]===a[r][st])continue;if(a[r][st]!=null&&c-st>=3)for(let x=st;x<c;x++)s.add(id(r,x));st=c}}for(let c=0;c<C;c++){let st=0;for(let r=1;r<=R;r++){if(r<R&&a[r][c]!=null&&a[r][c]===a[st][c])continue;if(a[st]?.[c]!=null&&r-st>=3)for(let x=st;x<r;x++)s.add(id(x,c));st=r}}return s}function valid(r,c,x,y){swap(r,c,x,y);let z=matches().size>0;swap(r,c,x,y);return z}function find(){for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[d,e]of[[0,1],[1,0]])if(inside(r+d,c+e)&&valid(r,c,r+d,c+e))return[r,c,r+d,c+e]}function make(){a=Array.from({length:R},()=>Array(C));for(let r=0;r<R;r++)for(let c=0;c<C;c++){let o=[0,1,2,3,4].filter(v=>!(c>1&&a[r][c-1]===v&&a[r][c-2]===v)&&!(r>1&&a[r-1][c]===v&&a[r-2][c]===v));a[r][c]=o[Math.floor(Math.random()*o.length)]}if(!find())make()}function render(){bd.innerHTML="";for(let r=0;r<R;r++)for(let c=0;c<C;c++){let d=document.createElement("div");d.className="cell";d.dataset.r=r;d.dataset.c=c;d.textContent=a[r][c]==null?"":F[a[r][c]];bd.appendChild(d)}}function fall(){for(let c=0;c<C;c++){let v=[];for(let r=R-1;r>=0;r--)if(a[r][c]!=null)v.push(a[r][c]);for(let r=R-1,i=0;r>=0;r--,i++)a[r][c]=i<v.length?v[i]:rnd()}}const sleep=n=>new Promise(x=>setTimeout(x,n));async function resolve(){while(1){let m=matches();if(!m.size)break;m.forEach(k=>{a[Math.floor(k/C)][k%C]=null});score+=m.size*2;q("s").textContent=score;fall();render();await sleep(130)}if(!find()){make();render();q("msg").textContent="无可走步骤，已重新排列"}}async function move(r,c,x,y){if(!on||busy||!inside(x,y)||Math.abs(r-x)+Math.abs(c-y)!==1)return;busy=true;if(!valid(r,c,x,y)){q("msg").textContent="交换无效";busy=false;return}swap(r,c,x,y);render();await resolve();busy=false}function start(){clearInterval(timer);score=0;time=60;on=true;q("s").textContent=0;q("t").textContent="60s";make();render();timer=setInterval(()=>{time--;q("t").textContent=time+"s";if(time<=0){clearInterval(timer);on=false;if(score>best){best=score;localStorage.m3best=best;q("b").textContent=best}q("msg").textContent="时间到，本局 "+score+" 分"}},1000)}bd.onpointerdown=e=>{let d=e.target.closest(".cell");if(d&&on)p={x:e.clientX,y:e.clientY,r:+d.dataset.r,c:+d.dataset.c}};bd.onpointerup=e=>{if(!p)return;let dx=e.clientX-p.x,dy=e.clientY-p.y,r=p.r,c=p.c,x=r,y=c;if(Math.max(Math.abs(dx),Math.abs(dy))<10){p=null;return}if(Math.abs(dx)>Math.abs(dy))y+=dx>0?1:-1;else x+=dy>0?1:-1;move(r,c,x,y);p=null};q("start").onclick=start;q("hint").onclick=()=>{document.querySelectorAll(".hint").forEach(x=>x.classList.remove("hint"));let m=find();if(m){bd.children[id(m[0],m[1])].classList.add("hint");bd.children[id(m[2],m[3])].classList.add("hint")}};make();render()})()</script></body></html>
