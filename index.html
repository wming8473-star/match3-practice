<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#21150f"><title>消消乐练习 V4.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#69472b,#23160f 70%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#fff;touch-action:none}
#app{height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.top{height:76px;display:flex;align-items:center;justify-content:space-around;background:linear-gradient(#8c5a31,#503019);border:4px solid #2d190e;border-radius:18px;box-shadow:inset 0 2px 0 #c8925c,0 5px 12px #0008}
.stat{text-align:center;min-width:95px}.label{font-size:13px;color:#f7ddb0}.value{font-size:28px;font-weight:900;text-shadow:0 3px 2px #0008}.time.low{animation:pulse .5s infinite;color:#ffd25c}@keyframes pulse{50%{transform:scale(1.13)}}
#wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#board{position:relative;width:min(94vw,460px);aspect-ratio:8/10;border:9px solid #422817;border-radius:13px;background:linear-gradient(135deg,#44291a,#2b1a12);box-shadow:inset 0 0 0 3px #9c693a,inset 0 0 25px #000,0 8px 18px #0009;overflow:hidden;touch-action:none}
.cell{position:absolute;width:12.5%;height:10%;display:flex;align-items:center;justify-content:center;will-change:transform,opacity;transition:transform 180ms cubic-bezier(.2,.85,.3,1),opacity 150ms;z-index:2}
.cell:before{content:"";position:absolute;inset:4%;border-radius:12px;background:#0001}
.fruit{position:relative;width:86%;height:86%;display:flex;align-items:center;justify-content:center;font-size:0;filter:drop-shadow(0 3px 2px #0007);user-select:none;transform:scale(1);transition:transform 120ms,filter 120ms;background-size:contain;background-repeat:no-repeat;background-position:center}.fruit[data-f="🍓"]{background-image:url("fruit-strawberry.svg")}.fruit[data-f="🍑"]{background-image:url("fruit-peach.svg")}.fruit[data-f="🍌"]{background-image:url("fruit-banana.svg")}.fruit[data-f="🫐"]{background-image:url("fruit-blueberry.svg")}.fruit[data-f="🥑"]{background-image:url("fruit-avocado.svg")}
.cell.selected .fruit{transform:scale(1.15);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 4px 2px #0007)}
.cell.pop .fruit{animation:pop .24s ease-out forwards}@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.38);filter:brightness(1.8) drop-shadow(0 0 12px #fff)}100%{transform:scale(.05) rotate(18deg);opacity:0}}
.cell.born .fruit{animation:born .26s cubic-bezier(.2,1.5,.5,1)}@keyframes born{0%{transform:scale(.25)}100%{transform:scale(1)}}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff7a0;pointer-events:none;z-index:9;animation:spark .45s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
.float{position:absolute;z-index:20;left:50%;top:43%;transform:translate(-50%,-50%);font-weight:1000;font-style:italic;font-size:clamp(30px,10vw,55px);white-space:nowrap;color:#fff06b;text-shadow:0 4px 0 #b94318,0 7px 7px #000;animation:float .75s ease-out forwards;pointer-events:none}@keyframes float{0%{opacity:0;transform:translate(-50%,-30%) scale(.45)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-75%) scale(.9)}}
#count{position:absolute;z-index:30;font-size:100px;font-weight:1000;color:#ffe963;text-shadow:0 7px 0 #b84218,0 12px 15px #000;animation:count .7s ease both}@keyframes count{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.2);opacity:1}100%{transform:scale(.8);opacity:0}}
.controls{height:62px;display:flex;gap:8px;padding-top:9px}.controls button{flex:1;border:0;border-radius:15px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(#f3a73b,#bd5b18);box-shadow:inset 0 2px #ffd68b,0 4px #6d310f}.controls button:active{transform:translateY(3px);box-shadow:inset 0 2px #ffd68b,0 1px #6d310f}
#overlay{position:absolute;inset:0;z-index:40;background:#160d09d9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.big{font-size:42px;font-weight:1000;color:#ffe76a;text-shadow:0 4px #a9431b}.sub{margin:10px 0 22px;color:#ffe9c9}#overlay button{padding:13px 35px;border:0;border-radius:18px;font-size:20px;font-weight:900;background:#ffb43e;color:#54250e}
.special .fruit{font-size:0;filter:drop-shadow(0 0 6px #9ff) drop-shadow(0 3px 2px #0008)}
.bomb .fruit:after{content:"";width:78%;height:78%;display:block;border-radius:50% 48% 52% 46%;background:radial-gradient(circle at 68% 62%,#20d8d4 0 10%,transparent 11%),radial-gradient(circle at 32% 30%,#d59aff 0 9%,transparent 10%),radial-gradient(circle at 50% 50%,#8c43d8 0 48%,#552093 52% 66%,#a96cff 69% 74%,#4b176f 77%);box-shadow:0 0 4px #fff,0 0 10px #8e74ff;transform:rotate(-15deg)}
.starH .fruit:after,.starV .fruit:after{content:"★";font-size:42px;line-height:1;background:conic-gradient(#ff4d4d,#ffd94a,#5ee66c,#45d8ff,#9d5cff,#ff5fcb,#ff4d4d);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 4px white)}
.starH .fruit:before,.starV .fruit:before{position:absolute;z-index:3;color:#fff;font-size:22px;font-weight:1000;text-shadow:0 0 4px #36f}
.starH .fruit:before{content:"↔"}.starV .fruit:before{content:"↕"}
.heart .fruit:after{content:"♥";font-size:45px;line-height:1;background:conic-gradient(from 20deg,#ff4242,#ffd94a,#55e87c,#3edcff,#7858ff,#ff55bc,#ff4242);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:2px #fff9;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px #79a8ff)}
.wave{position:absolute;z-index:15;pointer-events:none;background:#fff9;box-shadow:0 0 16px #fff,0 0 28px #7df;animation:wave .3s ease-out forwards}.wave.h{left:0;width:100%;height:8%;transform:translateY(-50%)}.wave.v{top:0;height:100%;width:10%;transform:translateX(-50%)}@keyframes wave{0%{opacity:0;filter:blur(10px)}35%{opacity:1}100%{opacity:0;filter:blur(1px)}}
#debug{position:fixed;left:8px;right:8px;bottom:76px;z-index:9999;background:#400;color:#fff;padding:8px;border-radius:8px;font-size:12px;white-space:pre-wrap;display:none;max-height:35vh;overflow:auto}</style><script>window.__bootOK=true;window.onerror=function(m,u,l,c){var d=document.getElementById("debug");if(d){d.style.display="block";d.textContent="JS错误："+m+"\n第 "+l+" 行，第 "+c+" 列";}};</script></head><body><div id="app"><div class="top"><div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">剩余时间</div><div class="value time" id="time">60</div></div><div class="stat"><div class="label">最高分</div><div class="value" id="best">0</div></div></div><div id="wrap"><div id="board"></div><div id="count"></div><div id="overlay"><div class="big">消消乐练习 V4.0</div><div class="sub">录像画面适配版</div><button id="play" type="button" style="background:#39d353;color:#102b16" onclick="this.textContent='按钮已点到';this.style.background='#ffdf4d';var d=document.getElementById('debug');d.style.display='block';d.textContent=window.__startGame?'按钮正常，正在启动…':'主游戏脚本没有加载成功';if(window.__startGame)window.__startGame()">开始游戏 V4.0</button></div></div><div id="debug"></div><div class="controls"><button id="restart">重新开始</button><button id="test">特效测试</button><button id="hint">提示</button></div></div>
<script>
(function(){
var R=10,C=8,T=["🍓","🍑","🍌","🫐","🥑"],board=document.getElementById("board"),scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),overlay=document.getElementById("overlay"),countEl=document.getElementById("count");
var grid=[],spec=[],score=0,left=60,timer=null,playing=false,down=null;
function rnd(){return T[Math.floor(Math.random()*T.length)]}
function init(){grid=[];spec=[];for(var r=0;r<R;r++){grid[r]=[];spec[r]=[];for(var c=0;c<C;c++){var x=rnd();while((c>1&&grid[r][c-1]===x&&grid[r][c-2]===x)||(r>1&&grid[r-1][c]===x&&grid[r-2][c]===x))x=rnd();grid[r][c]=x;spec[r][c]=""}}}
function draw(){board.innerHTML="";for(var r=0;r<R;r++)for(var c=0;c<C;c++){var e=document.createElement("div");e.className="cell"+(spec[r][c]?" special "+spec[r][c]:"");e.setAttribute("data-r",r);e.setAttribute("data-c",c);e.style.transform="translate("+(c*100)+"%,"+(r*100)+"%)";var f=document.createElement("div");f.className="fruit";f.setAttribute("data-f",grid[r][c]);f.textContent="";e.appendChild(f);board.appendChild(e)}}
function scan(){var hit=[];for(var i=0;i<R*C;i++)hit[i]=false;for(var r=0;r<R;r++){var s=0;for(var c=1;c<=C;c++){if(c===C||grid[r][c]!==grid[r][s]){if(c-s>=3)for(var x=s;x<c;x++)hit[r*C+x]=true;s=c}}}for(var c2=0;c2<C;c2++){var s2=0;for(var r2=1;r2<=R;r2++){if(r2===R||grid[r2][c2]!==grid[s2][c2]){if(r2-s2>=3)for(var y=s2;y<r2;y++)hit[y*C+c2]=true;s2=r2}}}return hit}
function any(hit){for(var i=0;i<hit.length;i++)if(hit[i])return true;return false}
function swap(r1,c1,r2,c2){var t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t;var s=spec[r1][c1];spec[r1][c1]=spec[r2][c2];spec[r2][c2]=s}
function specialHit(r,c,hit){var s=spec[r][c],x,y;if(s=="bomb"){for(y=r-1;y<=r+1;y++)for(x=c-1;x<=c+1;x++)if(y>=0&&y<R&&x>=0&&x<C)hit[y*C+x]=true}else if(s=="starH"){for(x=0;x<C;x++)hit[r*C+x]=true}else if(s=="starV"){for(y=0;y<R;y++)hit[y*C+c]=true}}
function expand(hit){var changed=true,r,c,i;while(changed){changed=false;for(r=0;r<R;r++)for(c=0;c<C;c++){i=r*C+c;if(hit[i]&&spec[r][c]){var before=0,after=0,j;for(j=0;j<hit.length;j++)if(hit[j])before++;specialHit(r,c,hit);for(j=0;j<hit.length;j++)if(hit[j])after++;if(after>before)changed=true}}}}
function fall(hit){expand(hit);var n=0;for(var c=0;c<C;c++){var vals=[];for(var r=R-1;r>=0;r--)if(!hit[r*C+c])vals.push({v:grid[r][c],s:spec[r][c]});for(var rr=R-1,k=0;rr>=0;rr--,k++)if(k<vals.length){grid[rr][c]=vals[k].v;spec[rr][c]=vals[k].s}else{grid[rr][c]=rnd();spec[rr][c]=""}}for(var i=0;i<hit.length;i++)if(hit[i])n++;score+=n*2;scoreEl.textContent=score}
function resolve(done){var hit=scan();if(!any(hit)){draw();if(done)done();return}var cells=board.querySelectorAll(".cell");for(var i=0;i<hit.length;i++)if(hit[i]&&cells[i])cells[i].className+=" pop";setTimeout(function(){fall(hit);draw();setTimeout(function(){resolve(done)},220)},260)}
function combo(r1,c1,r2,c2){var s1=spec[r1][c1],s2=spec[r2][c2],hit=[],i,r,c,x,y;for(i=0;i<R*C;i++)hit[i]=false;hit[r1*C+c1]=true;hit[r2*C+c2]=true;
if(s1=="heart"&&s2=="heart"){for(i=0;i<R*C;i++)hit[i]=true}
else if(s1=="heart"||s2=="heart"){var hr=s1=="heart"?r1:r2,hc=s1=="heart"?c1:c2,or=s1=="heart"?r2:r1,oc=s1=="heart"?c2:c1,os=spec[or][oc],typ=grid[or][oc];if(os){var made=0;for(r=0;r<R&&made<8;r++)for(c=0;c<C&&made<8;c++)if(!spec[r][c]&&Math.random()<0.22){spec[r][c]=os;hit[r*C+c]=true;made++}}else{for(r=0;r<R;r++)for(c=0;c<C;c++)if(grid[r][c]==typ)hit[r*C+c]=true}}
else if((s1=="bomb"&&(s2=="starH"||s2=="starV"))||(s2=="bomb"&&(s1=="starH"||s1=="starV"))){var br=s1=="bomb"?r1:r2,bc=s1=="bomb"?c1:c2,ss=s1=="bomb"?s2:s1;if(ss=="starH"){for(y=Math.max(0,br-1);y<=Math.min(R-1,br+1);y++)for(x=0;x<C;x++)hit[y*C+x]=true}else{for(x=Math.max(0,bc-1);x<=Math.min(C-1,bc+1);x++)for(y=0;y<R;y++)hit[y*C+x]=true}}
else{specialHit(r1,c1,hit);specialHit(r2,c2,hit)}
fall(hit);draw();setTimeout(function(){resolve()},220)}
function trySwap(r1,c1,r2,c2){if(!playing)return;if(r2<0||r2>=R||c2<0||c2>=C)return;swap(r1,c1,r2,c2);draw();setTimeout(function(){if(spec[r1][c1]||spec[r2][c2]){combo(r1,c1,r2,c2);return}var hit=scan();if(any(hit)){resolve()}else{swap(r1,c1,r2,c2);draw()}},180)}
function start(){if(timer)clearInterval(timer);playing=false;score=0;left=60;scoreEl.textContent="0";timeEl.textContent="60";overlay.style.display="none";init();draw();var n=3;countEl.textContent=n;var cd=setInterval(function(){n--;if(n>0){countEl.textContent=n}else{clearInterval(cd);countEl.textContent="";playing=true;timer=setInterval(function(){left--;timeEl.textContent=left;if(left<=0){clearInterval(timer);playing=false;overlay.innerHTML='<div class="big">时间到！</div><div class="sub">本局得分：'+score+'</div><button type="button" onclick="window.__startGame()">再来一局</button>';overlay.style.display="flex"}},1000)}},700)}
window.__startGame=start;
board.addEventListener("touchstart",function(e){if(!playing)return;var el=e.target;while(el&&el!==board&&!el.getAttribute("data-r"))el=el.parentNode;if(!el||el===board)return;var t=e.touches[0];down={r:+el.getAttribute("data-r"),c:+el.getAttribute("data-c"),x:t.clientX,y:t.clientY};e.preventDefault()},{passive:false});
board.addEventListener("touchend",function(e){if(!down||!playing)return;var t=e.changedTouches[0],dx=t.clientX-down.x,dy=t.clientY-down.y,r2=down.r,c2=down.c;if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1;var d=down;down=null;trySwap(d.r,d.c,r2,c2);e.preventDefault()},{passive:false});
document.getElementById("restart").onclick=start;
document.getElementById("test").onclick=function(){if(!playing)return;spec[2][2]="bomb";spec[2][5]="starH";spec[6][2]="starV";spec[6][5]="heart";draw();var d=document.getElementById("debug");d.style.display="block";d.textContent="已放入：紫色3×3、横向星星、竖向星星、彩虹爱心";};
document.getElementById("hint").onclick=function(){};
})();
</script></body></html>
